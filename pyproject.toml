[project]
name = "code-qa"
version = "0.0.0"
description = "Conversational code Q&A agent over a target repository (multi-agent, LangGraph)."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.0",
    "azure-identity>=1.17.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "tree-sitter>=0.23,<0.26",
    "tree-sitter-python>=0.23",
    "tree-sitter-java>=0.23",
]

[project.optional-dependencies]
# Local embeddings for semantic doc RAG. Azure ada-2 needs nothing extra
# (langchain-openai + azure-identity are already core deps).
semantic = ["sentence-transformers>=2.2", "langchain-huggingface>=0.1"]

[project.scripts]
code-qa = "code_qa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_qa"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
